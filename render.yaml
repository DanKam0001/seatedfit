services:
  - type: web
    name: seatedfit
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn seatedfit.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: LIVE_DAILY_CAP
        value: "10"
      - key: YOURCAM_API_KEY
        sync: false
